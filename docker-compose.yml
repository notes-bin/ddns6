  # 腾讯云 DNSPod (API v3)
  ddns6-tencent:
    <<: *ddns6
    command:
      - run
      - tencent
      - --secret-id=${TENCENT_SECRET_ID}
      - --secret-key=${TENCENT_SECRET_KEY}
      - --domain=${DOMAIN}
      - --subdomain=${SUBDOMAIN:-@}
      - --interface=${INTERFACE:-}
      - --ttl=${TTL:-600}
      - --interval=${INTERVAL:-5m}

