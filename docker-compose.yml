# ============================================================
# Docker Compose 部署 DDNS6
#
# 使用方式：
#   1. cp .env.example .env，填入配置（勿提交 .env）
#   2. 推荐：取消注释 ddns6-config（配置文件模式，密钥不进进程参数）
#   3. 或：取消注释某一 CLI provider 服务
#   4. docker compose up -d
#
# 安全约定（对齐 docker-patterns）：
#   - 密钥优先放 ~/.ddns6/config.yaml，避免出现在 docker inspect / ps
#   - 镜像以非 root (uid 10001) 运行；只读根文件系统 + tmpfs
#   - 收紧 capability：仅保留 Netlink 所需的 NET_ADMIN
#   - network_mode: host 仅在 Linux 有效（macOS Docker Desktop 无效）
# ============================================================

x-ddns6: &ddns6
  build:
    context: .
    dockerfile: Dockerfile
  network_mode: host
  restart: unless-stopped
  # 禁止提权；只读根 FS；临时目录用 tmpfs
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  cap_add:
    - NET_ADMIN
  env_file:
    - path: .env
      required: false

services:
  # ---------- 配置文件模式（推荐） ----------
  # 将主机 ~/.ddns6 挂载到容器 HOME；密钥留在文件中，不进入 argv
  # ddns6-config:
