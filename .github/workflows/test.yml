# ============================================================
# 持续集成：在 push / pull_request 上运行 race + cover 测试
# ============================================================

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 静态分析
        run: go vet ./...

      - name: 单元测试（race + cover）
        run: go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -n 1
