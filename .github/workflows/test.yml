name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 静态分析与单元测试
        run: |
          go vet ./...
          go test ./... -race -count=1 -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -n 1
